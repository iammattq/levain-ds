name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm at the version package.json's packageManager names (the one the lockfile was made with)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types (both packages)
        run: pnpm check:types

      - name: Tests (both packages)
        run: pnpm test

      - name: Build (smoke/: every export, through Vite and Tailwind 4, as a consumer builds it)
        run: pnpm build
